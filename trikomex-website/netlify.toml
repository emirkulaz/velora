[build]
  publish = "."
  command = "npm run build"

[build.processing]
  skip_processing = false

[build.environment]
  NODE_VERSION = "20"

# Do not treat this as a Node app publish folder
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/custom-product"
  to = "/custom-product.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Real files win; unknown paths fall back to home instead of Netlify 404 card
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
