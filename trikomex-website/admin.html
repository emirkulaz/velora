<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Demandes TRIKOMEX</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="logo.jpg.jpg">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-page {
      min-height: 100vh;
      padding: 2rem 5% 4rem;
    }

    .admin-head {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .admin-head h1 {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      color: var(--navy);
      margin-bottom: 0.35rem;
    }

    .admin-head p {
      color: var(--text-muted);
    }

    .admin-status {
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: var(--cream-soft);
      border-inline-start: 3px solid var(--gold);
      color: var(--text-muted);
      font-weight: 600;
    }

    .admin-status.error {
      border-inline-start-color: #8b2e2e;
      color: #8b2e2e;
    }

    .quotes-table-wrap {
      overflow-x: auto;
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid rgba(11, 31, 58, 0.06);
      box-shadow: var(--shadow);
    }

    table.quotes-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }

    .quotes-table th,
    .quotes-table td {
      padding: 0.9rem 1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--gray);
      font-size: 0.9rem;
    }

    .quotes-table th {
      background: var(--navy);
      color: var(--white);
      font-weight: 700;
      position: sticky;
      top: 0;
    }

    .quotes-table tr:last-child td {
      border-bottom: none;
    }

    .quotes-table td.message-cell {
      max-width: 240px;
      white-space: pre-wrap;
      color: var(--text-muted);
    }

    .empty-state {
      padding: 2.5rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <header class="custom-topbar">
    <a class="brand" href="index.html">
      <img src="logo.jpg.jpg" alt="TRIKOMEX" width="40" height="40" class="brand-logo">
      <span class="brand-name">TRIKOMEX</span>
    </a>
    <a class="btn btn-sm btn-outline-dark" href="index.html">Retour au site</a>
  </header>

  <main class="admin-page">
    <div class="admin-head">
      <div>
        <h1>Demandes de devis</h1>
        <p>Données enregistrées dans SQLite (`db/trikomex.db`).</p>
      </div>
      <button type="button" class="btn btn-gold btn-sm" id="refreshBtn">Actualiser</button>
    </div>

    <div class="admin-status" id="adminStatus">Chargement…</div>

    <div class="quotes-table-wrap">
      <table class="quotes-table" id="quotesTable" hidden>
        <thead>
          <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Nom</th>
            <th>Contact</th>
            <th>Produit</th>
            <th>Qté / Dimensions</th>
            <th>Message</th>
            <th>Fichier</th>
          </tr>
        </thead>
        <tbody id="quotesBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" hidden>Aucune demande pour le moment.</div>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById("adminStatus");
    const tableEl = document.getElementById("quotesTable");
    const bodyEl = document.getElementById("quotesBody");
    const emptyEl = document.getElementById("emptyState");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadQuotes() {
      statusEl.textContent = "Chargement…";
      statusEl.classList.remove("error");

      try {
        const response = await fetch("/api/quotes");
        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Erreur API");
        }

        const quotes = data.quotes || [];
        statusEl.textContent = quotes.length + " demande(s) dans SQLite.";

        if (!quotes.length) {
          tableEl.hidden = true;
          emptyEl.hidden = false;
          bodyEl.innerHTML = "";
          return;
        }

        emptyEl.hidden = true;
        tableEl.hidden = false;
        bodyEl.innerHTML = quotes.map(function (q) {
          const fileCell = q.file_name
            ? '<a href="/uploads/' + encodeURIComponent(q.file_name) + '" target="_blank" rel="noopener">Fichier</a>'
            : "—";

          return (
            "<tr>" +
              "<td>" + escapeHtml(q.id) + "</td>" +
              "<td>" + escapeHtml(q.created_at) + "</td>" +
              "<td>" + escapeHtml(q.name) + "</td>" +
              "<td>" +
                escapeHtml(q.phone) + "<br>" +
                '<a href="mailto:' + escapeHtml(q.email) + '">' + escapeHtml(q.email) + "</a>" +
              "</td>" +
              "<td>" + escapeHtml(q.product_type) + "</td>" +
              "<td>" + escapeHtml(q.quantity || "—") + "<br>" + escapeHtml(q.dimensions || "—") + "</td>" +
              '<td class="message-cell">' + escapeHtml(q.message || "—") + "</td>" +
              "<td>" + fileCell + "</td>" +
            "</tr>"
          );
        }).join("");
      } catch (error) {
        statusEl.textContent = "Impossible de charger les demandes. Lancez le serveur avec npm start.";
        statusEl.classList.add("error");
        tableEl.hidden = true;
        emptyEl.hidden = true;
        console.error(error);
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadQuotes);
    loadQuotes();
  </script>
</body>

</html>
