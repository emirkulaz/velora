# Railway → API service: Settings → Config-as-code → railway.api.toml
# Root Directory: / (repo root)
# Watch Paths: velora-api-v2/**, deploy/api.Dockerfile, deploy/api-entrypoint.sh

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/api.Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
